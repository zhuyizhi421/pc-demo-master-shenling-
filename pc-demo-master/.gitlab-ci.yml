stages:
  - install
  - build
  - push
  - deploy

variables:
  APPNAME: "mes-frontend-pc"

install:develop:
  stage: install
  tags:
    - docker
  image: node:18-alpine
  rules:
    - if: "$CI_COMMIT_BRANCH =~ /develop$/"
      changes:
        - "*"
        - "public/**/*"
        - "src/**/*"
  script:
    - |
      yarn config set registry http://registry.npmmirror.com
      yarn
  artifacts:
    paths:
      - node_modules

install:test:
  stage: install
  tags:
    - docker
  image: node:18-alpine
  rules:
    - if: "$CI_COMMIT_BRANCH =~ /release/"
      changes:
        - "*"
        - "public/**/*"
        - "src/**/*"
  script:
    - |
      yarn config set registry http://registry.npmmirror.com
      yarn
  artifacts:
    paths:
      - node_modules

build:develop:
  stage: build
  tags:
    - docker
  image: node:18-alpine
  rules:
    - if: "$CI_COMMIT_BRANCH =~ /develop$/"
      changes:
        - "*"
        - "public/**/*"
        - "src/**/*"
  script:
    - |
      yarn build
      cat > Dockerfile << EOF
      FROM nginx:1.23-alpine
      COPY nginx.conf /etc/nginx/conf.d/default.conf
      WORKDIR /usr/share/nginx/html
      COPY ./dist .
      RUN rm /usr/bin/nc
      EOF
  artifacts:
    paths:
      - dist
      - Dockerfile

build:test:
  stage: build
  tags:
    - docker
  image: node:18-alpine
  rules:
    - if: "$CI_COMMIT_BRANCH =~ /release/"
      changes:
        - "*"
        - "public/**/*"
        - "src/**/*"
  script:
    - |
      yarn build
      cat > Dockerfile << EOF
      FROM nginx:1.23-alpine
      COPY nginx.conf /etc/nginx/conf.d/default.conf
      WORKDIR /usr/share/nginx/html
      COPY ./dist .
      RUN rm /usr/bin/nc
      EOF
  artifacts:
    paths:
      - dist
      - Dockerfile

push:develop:
  stage: push
  tags:
    - docker
  image: docker
  rules:
    - if: "$CI_COMMIT_BRANCH =~ /develop$/"
      changes:
        - "*"
        - "public/**/*"
        - "src/**/*"
  before_script:
    - echo $PROJECT_REGISTRY_PASS | docker login http://$PROJECT_REGISTRY --username $PROJECT_REGISTRY_USER --password-stdin
  script:
    - |
      IMAGE_PATH=$PROJECT_REGISTRY/$SUBGROUP_NAME/$CI_COMMIT_BRANCH/$APPNAME
      echo $IMAGE_PATH
      docker build -t $IMAGE_PATH .
      docker push $IMAGE_PATH
      docker rmi $IMAGE_PATH

push:test:
  stage: push
  tags:
    - docker
  image: docker
  rules:
    - if: "$CI_COMMIT_BRANCH =~ /release/"
      changes:
        - "*"
        - "public/**/*"
        - "src/**/*"
  before_script:
    - echo $PROJECT_REGISTRY_PASS | docker login http://$PROJECT_REGISTRY --username $PROJECT_REGISTRY_USER --password-stdin
  script:
    - |
      IMAGE_PATH=$PROJECT_REGISTRY/$SUBGROUP_NAME/$CI_COMMIT_BRANCH/$APPNAME
      echo $IMAGE_PATH
      VERSION=${CI_COMMIT_BRANCH##*/}
      docker build -t $IMAGE_PATH:$VERSION .
      docker push $IMAGE_PATH:$VERSION
      docker rmi $IMAGE_PATH:$VERSION

deploy:develop:
  stage: deploy
  tags:
    - k8s-shell
  rules:
    - if: "$CI_COMMIT_BRANCH =~ /develop$/"
      changes:
        - "*"
        - "public/**/*"
        - "src/**/*"
  script:
    - |
      VERSION=latest
      IMAGE_PATH=$PROJECT_REGISTRY/$SUBGROUP_NAME/$CI_COMMIT_BRANCH/$APPNAME
      bash /opt/k8s-cicd-new/deploy.sh --g-front-general-new $APPNAME $IMAGE_PATH $VERSION $CI_COMMIT_BRANCH-$VERSION
      bash /opt/k8s-cicd-new/deploy.sh -d $APPNAME $CI_COMMIT_BRANCH
deploy:test:
  stage: deploy
  tags:
    - k8s-shell
  rules:
    - if: "$CI_COMMIT_BRANCH =~ /release/"
      changes:
        - "*"
        - "public/**/*"
        - "src/**/*"
  script:
    - |
      VERSION=${CI_COMMIT_BRANCH##*/}
      NAMESPACE=${CI_COMMIT_BRANCH%/*}
      echo $VERSION
      echo $IMAGE_PATH
      IMAGE_PATH=$PROJECT_REGISTRY/$SUBGROUP_NAME/$CI_COMMIT_BRANCH/$APPNAME
      bash /opt/k8s-cicd-new/deploy.sh --g-front-general-new $APPNAME $IMAGE_PATH $VERSION $NAMESPACE-$VERSION
      bash /opt/k8s-cicd-new/deploy.sh -d $APPNAME $NAMESPACE
